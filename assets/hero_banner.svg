<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <!-- Background Night Urban Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="40%" stop-color="#050b14"/>
      <stop offset="75%" stop-color="#0a1936"/>
      <stop offset="100%" stop-color="#02050b"/>
    </linearGradient>

    <radialGradient id="neonBlueGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(0,240,255,0.4)"/>
      <stop offset="50%" stop-color="rgba(0,114,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(5,11,20,0)"/>
    </radialGradient>

    <radialGradient id="policeRedGlow" cx="15%" cy="60%" r="35%">
      <stop offset="0%" stop-color="rgba(255,0,55,0.3)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>

    <radialGradient id="policeBlueGlow" cx="85%" cy="60%" r="35%">
      <stop offset="0%" stop-color="rgba(0,210,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>

    <linearGradient id="goldCrownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff2a3"/>
      <stop offset="40%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>

    <linearGradient id="textNeonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0f7fc"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="crownGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Background Base -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- City Skyline Silhouettes -->
  <path d="M 0,450 L 50,420 L 90,450 L 140,380 L 190,450 L 250,350 L 320,450 L 400,390 L 480,450 L 550,340 L 620,450 L 700,360 L 780,450 L 850,370 L 920,450 L 990,340 L 1050,450 L 1120,380 L 1200,450 L 1280,400 L 1280,720 L 0,720 Z" fill="#040912" opacity="0.8"/>
  <path d="M 0,500 L 80,480 L 160,510 L 280,460 L 390,520 L 510,470 L 640,520 L 750,460 L 880,510 L 1000,460 L 1150,510 L 1280,470 L 1280,720 L 0,720 Z" fill="#071224" opacity="0.9"/>

  <!-- Neon Ambient Lights -->
  <circle cx="640" cy="280" r="450" fill="url(#neonBlueGlow)"/>
  <circle cx="200" cy="450" r="300" fill="url(#policeRedGlow)"/>
  <circle cx="1080" cy="450" r="300" fill="url(#policeBlueGlow)"/>

  <!-- Police Car Lights & Grid Street Effect -->
  <path d="M 0,550 L 1280,550" stroke="#00f0ff" stroke-width="1" opacity="0.2"/>
  <path d="M 0,620 L 1280,620" stroke="#00f0ff" stroke-width="1.5" opacity="0.3"/>
  <path d="M 0,700 L 1280,700" stroke="#00f0ff" stroke-width="2" opacity="0.4"/>
  
  <!-- Perspective Road Lines -->
  <line x1="640" y1="520" x2="100" y2="720" stroke="#00d2ff" stroke-width="2" opacity="0.3"/>
  <line x1="640" y1="520" x2="350" y2="720" stroke="#00d2ff" stroke-width="1.5" opacity="0.2"/>
  <line x1="640" y1="520" x2="930" y2="720" stroke="#00d2ff" stroke-width="1.5" opacity="0.2"/>
  <line x1="640" y1="520" x2="1180" y2="720" stroke="#00d2ff" stroke-width="2" opacity="0.3"/>

  <!-- Left GTA Character Silhouette & Hoodie/Chain ("KZ") -->
  <g transform="translate(60, 180)">
    <!-- Body/Hoodie -->
    <path d="M 70,500 L 40,320 L 80,220 L 150,160 L 230,220 L 260,320 L 230,500 Z" fill="#080f1e" stroke="#00f0ff" stroke-width="2" filter="url(#neonShadow)"/>
    <!-- Face Mask & Cap -->
    <path d="M 110,170 C 110,120 190,120 190,170 C 190,210 110,210 110,170 Z" fill="#050a14" stroke="#00f0ff" stroke-width="2"/>
    <!-- Cap Visor -->
    <path d="M 95,145 L 205,145 L 190,130 L 110,130 Z" fill="#0d1b36" stroke="#00f0ff" stroke-width="1.5"/>
    <!-- Gold Chain -->
    <path d="M 125,230 Q 150,280 175,230" fill="none" stroke="#ffd700" stroke-width="5" filter="url(#crownGlow)"/>
    <!-- Hoodie Branding "KZ" -->
    <text x="150" y="320" font-family="Impact, sans-serif" font-size="54" fill="#ffffff" stroke="#00f0ff" stroke-width="2" text-anchor="middle">KZ</text>
  </g>

  <!-- Right GTA Character Silhouette & Fedora Hat/Box ("KHALED ZONE") -->
  <g transform="translate(920, 180)">
    <!-- Body/Jacket -->
    <path d="M 70,500 L 40,320 L 80,220 L 150,160 L 230,220 L 260,320 L 230,500 Z" fill="#080f1e" stroke="#00f0ff" stroke-width="2" filter="url(#neonShadow)"/>
    <!-- Fedora Hat -->
    <ellipse cx="150" cy="140" rx="75" ry="16" fill="#0d1b36" stroke="#00f0ff" stroke-width="2"/>
    <path d="M 105,138 C 105,95 195,95 195,138 Z" fill="#050a14" stroke="#00f0ff" stroke-width="2"/>
    <!-- Sunglasses -->
    <rect x="120" y="165" width="25" height="14" rx="3" fill="#00f0ff" opacity="0.8"/>
    <rect x="155" y="165" width="25" height="14" rx="3" fill="#00f0ff" opacity="0.8"/>
    <line x1="145" y1="170" x2="155" y2="170" stroke="#00f0ff" stroke-width="2"/>
    <!-- Carrying Case / Box -->
    <rect x="75" y="330" width="150" height="110" rx="12" fill="#07142a" stroke="#00f0ff" stroke-width="2.5"/>
    <rect x="85" y="340" width="130" height="90" rx="8" fill="none" stroke="#ff6b00" stroke-width="1.5" opacity="0.6"/>
    <text x="150" y="395" font-family="Impact, sans-serif" font-size="18" fill="#ffd700" text-anchor="middle">KHALED ZONE</text>
  </g>

  <!-- CENTER LOGO GROUP: SHINY GOLDEN CROWN + KHALED ZONE GRAFFITI LOGO -->
  <g transform="translate(640, 240)">
    
    <!-- Large Golden Crown -->
    <g filter="url(#crownGlow)" transform="translate(0, -90)">
      <path d="M -110,-20 L -150,-100 L -60,-50 L 0,-130 L 60,-50 L 150,-100 L 110,-20 Z" fill="url(#goldCrownGrad)" stroke="#ffffff" stroke-width="3"/>
      <!-- Jewels on Crown Points -->
      <circle cx="-150" cy="-105" r="10" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
      <circle cx="0" cy="-135" r="14" fill="#00f0ff" stroke="#ffffff" stroke-width="3"/>
      <circle cx="150" cy="-105" r="10" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
      <!-- Crown Base Band -->
      <rect x="-115" y="-20" width="230" height="24" rx="6" fill="#cc7a00" stroke="#ffd700" stroke-width="2"/>
      <circle cx="-70" cy="-8" r="5" fill="#ffffff"/>
      <circle cx="0" cy="-8" r="6" fill="#00f0ff"/>
      <circle cx="70" cy="-8" r="5" fill="#ffffff"/>
    </g>

    <!-- Graffiti Shadow Backing -->
    <text x="4" y="54" font-family="Impact, sans-serif" font-size="105" fill="#000000" text-anchor="middle" letter-spacing="4">KHALED</text>
    <text x="4" y="154" font-family="Impact, sans-serif" font-size="105" fill="#000000" text-anchor="middle" letter-spacing="6">ZONE</text>

    <!-- Glowing Electric Blue Outer Stroke -->
    <text x="0" y="50" font-family="Impact, sans-serif" font-size="105" fill="none" stroke="#00f0ff" stroke-width="16" stroke-linejoin="round" text-anchor="middle" letter-spacing="4" filter="url(#neonShadow)">KHALED</text>
    <text x="0" y="150" font-family="Impact, sans-serif" font-size="105" fill="none" stroke="#00f0ff" stroke-width="16" stroke-linejoin="round" text-anchor="middle" letter-spacing="6" filter="url(#neonShadow)">ZONE</text>

    <!-- White Inner Fill -->
    <text x="0" y="50" font-family="Impact, sans-serif" font-size="105" fill="url(#textNeonGrad)" text-anchor="middle" letter-spacing="4">KHALED</text>
    <text x="0" y="150" font-family="Impact, sans-serif" font-size="105" fill="url(#textNeonGrad)" text-anchor="middle" letter-spacing="6">ZONE</text>

    <!-- SUBTITLE: GAME ACCOUNTS & DIGITAL SERVICES -->
    <rect x="-260" y="200" width="520" height="42" rx="21" fill="rgba(5, 11, 20, 0.85)" stroke="#00f0ff" stroke-width="2" filter="url(#neonShadow)"/>
    <text x="0" y="228" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#ffd700" text-anchor="middle" letter-spacing="2">
      GAME ACCOUNTS &amp; DIGITAL SERVICES
    </text>

  </g>

  <!-- Corner Badges -->
  <g transform="translate(60, 660)">
    <rect x="0" y="0" width="220" height="36" rx="10" fill="rgba(0,0,0,0.8)" stroke="#ff6b00" stroke-width="1.5"/>
    <polygon points="20,10 32,26 8,26" fill="#ff6b00"/>
    <text x="120" y="23" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">FiveM OFFICIAL</text>
  </g>

  <g transform="translate(1000, 660)">
    <rect x="0" y="0" width="220" height="36" rx="10" fill="rgba(0,0,0,0.8)" stroke="#00f0ff" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="6" fill="#00f0ff"/>
    <text x="120" y="23" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#00f0ff" text-anchor="middle">BLUE ZONE EDITION</text>
  </g>

</svg>
