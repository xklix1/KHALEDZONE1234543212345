<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل المنتج - KHALED ZONE</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            navy: { 950: '#030712', 900: '#050b14', 800: '#0a1326', 700: '#111d38', 600: '#1a2b52' },
            neon: { blue: '#00f0ff', orange: '#ff6b00', cyan: '#00d2ff' },
            gold: { crown: '#ffd700' }
          }
        }
      }
    }
  </script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#050b14] text-white min-h-screen">

  <!-- NAVIGATION BAR -->
  <header class="sticky top-0 z-40 bg-[#050b14]/80 backdrop-blur-xl border-b border-cyan-500/20 shadow-[0_4px_20px_rgba(0,0,0,0.8)]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      
      <div class="flex items-center gap-3">
        <a href="index.html" class="flex items-center gap-2 group">
          <div class="relative flex items-center justify-center w-12 h-12 rounded-xl bg-gradient-to-tr from-blue-900 to-cyan-500 p-0.5 shadow-[0_0_15px_rgba(0,240,255,0.5)]">
            <div class="w-full h-full bg-[#050b14] rounded-[10px] flex items-center justify-center relative">
              <span class="text-2xl crown-pulse">👑</span>
            </div>
          </div>
          <div class="flex flex-col">
            <div class="flex items-center gap-1.5">
              <span class="font-black text-xl tracking-wider text-white group-hover:text-cyan-400 transition">KHALED</span>
              <span class="font-black text-xl tracking-wider text-neon-blue">ZONE</span>
            </div>
            <span class="text-[10px] text-yellow-400 font-semibold tracking-widest flex items-center gap-1">
              <span>BLUE ZONE</span>
              <span class="text-xs">⚡</span>
            </span>
          </div>
        </a>
      </div>

      <nav class="hidden md:flex items-center gap-2 lg:gap-4 font-bold text-sm">
        <a href="/" class="px-4 py-2 text-gray-300 hover:text-cyan-400 hover:bg-cyan-950/40 rounded-xl transition">الرئيسية</a>
        <a href="/store" class="px-4 py-2 text-gray-300 hover:text-cyan-400 hover:bg-cyan-950/40 rounded-xl transition">المتجر</a>
        <a href="/offers" class="px-4 py-2 text-gray-300 hover:text-cyan-400 hover:bg-cyan-950/40 rounded-xl transition">العروض 🔥</a>
        <a href="/services" class="px-4 py-2 text-gray-300 hover:text-cyan-400 hover:bg-cyan-950/40 rounded-xl transition">خدمات</a>
        <a href="/about" class="px-4 py-2 text-gray-300 hover:text-cyan-400 hover:bg-cyan-950/40 rounded-xl transition">من نحن</a>
        <a href="/contact" class="px-4 py-2 text-gray-300 hover:text-cyan-400 hover:bg-cyan-950/40 rounded-xl transition">تواصل معنا</a>
      </nav>

      <div class="flex items-center gap-3">
        <button onclick="toggleSearchModal()" class="w-10 h-10 rounded-xl bg-navy-800/80 border border-cyan-500/30 flex items-center justify-center text-cyan-400 hover:bg-cyan-500 hover:text-black transition">
          <i class="bi bi-search text-lg"></i>
        </button>

        <button onclick="toggleCart()" class="relative w-11 h-11 rounded-xl bg-gradient-to-tr from-cyan-900 to-blue-600 p-0.5 shadow-[0_0_15px_rgba(0,240,255,0.4)] hover:scale-105 transition">
          <div class="w-full h-full bg-[#050b14] rounded-[10px] flex items-center justify-center text-cyan-400">
            <i class="bi bi-cart3 text-xl"></i>
          </div>
          <span id="cart-badge" class="absolute -top-1.5 -left-1.5 bg-gray-700 text-white font-black text-xs w-6 h-6 rounded-full flex items-center justify-center border-2 border-[#050b14]">0</span>
        </button>

        <button onclick="document.getElementById('mobile-menu').classList.toggle('hidden')" class="md:hidden w-10 h-10 rounded-xl bg-navy-800 border border-cyan-500/30 text-white flex items-center justify-center">
          <i class="bi bi-list text-2xl"></i>
        </button>
      </div>

    </div>

    <div id="mobile-menu" class="hidden md:hidden bg-[#050b14]/95 border-b border-cyan-500/30 px-4 py-4 space-y-2">
      <a href="index.html" class="block py-2 text-gray-300">الرئيسية</a>
      <a href="store.html" class="block py-2 text-gray-300">المتجر</a>
      <a href="offers.html" class="block py-2 text-gray-300">العروض</a>
      <a href="services.html" class="block py-2 text-gray-300">خدمات</a>
      <a href="about.html" class="block py-2 text-gray-300">من نحن</a>
      <a href="contact.html" class="block py-2 text-gray-300">تواصل معنا</a>
    </div>
  </header>

  <!-- DYNAMIC PRODUCT VIEW CONTAINER -->
  <section class="py-12 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div id="product-detail-view" class="glass-panel rounded-3xl p-8 border-cyan-500/30 grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
      <!-- Loaded dynamically via JavaScript -->
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="bg-[#030712] border-t border-cyan-500/20 text-gray-400 py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
      <div class="flex flex-col md:flex-row items-center justify-between gap-6 pb-8 border-b border-gray-800">
        <div class="flex items-center gap-3">
          <span class="text-3xl crown-pulse">👑</span>
          <div>
            <span class="font-black text-2xl text-white">KHALED <span class="text-neon-blue">ZONE</span></span>
            <p class="text-xs text-yellow-400">BLUE ZONE DIGITAL MARKETPLACE</p>
          </div>
        </div>
      </div>

      <div class="flex flex-col md:flex-row items-center justify-between gap-4 text-xs text-gray-500">
        <p>© 2026 KHALED ZONE - جميع الحقوق محفوظة. تم التطوير بواسطة <span class="text-neon-blue font-extrabold tracking-wider">KLIX</span></p>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id') || 'gta5-account';
      const item = window.products.find(p => p.id === productId) || window.products[0];
      
      const detailContainer = document.getElementById('product-detail-view');
      detailContainer.innerHTML = `
        <div class="h-80 sm:h-96 rounded-2xl overflow-hidden border border-cyan-500/40 relative bg-navy-900">
          <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover">
          <span class="absolute top-4 right-4 bg-cyan-950 border border-cyan-400 text-cyan-300 text-xs font-bold px-3 py-1 rounded-lg">${item.badge}</span>
        </div>

        <div class="space-y-6">
          <div>
            <span class="text-xs text-cyan-400 font-bold tracking-wider">${item.category.toUpperCase()}</span>
            <h1 class="text-4xl font-black text-white mt-1">${item.title}</h1>
            <p class="text-sm text-gray-400 mt-1">${item.subTitle}</p>
          </div>

          <div class="flex items-center gap-4">
            <span class="text-3xl font-black text-yellow-400">${item.price} جنيه</span>
            ${item.oldPrice ? `<span class="text-lg text-gray-500 line-through">${item.oldPrice} جنيه</span>` : ''}
            <span class="text-xs text-yellow-400 bg-yellow-950 border border-yellow-500 px-2.5 py-1 rounded-lg font-bold">${item.rating} تقييم الممتاز</span>
          </div>

          <div class="space-y-3 bg-navy-950 p-5 rounded-2xl border border-cyan-500/20">
            <h4 class="font-bold text-sm text-cyan-400">مميزات الحساب والضمان:</h4>
            <ul class="text-xs text-gray-300 space-y-2">
              ${item.features.map(f => `<li class="flex items-center gap-2"><span class="text-cyan-400 font-bold">✓</span> ${f}</li>`).join('')}
            </ul>
          </div>

          <div class="flex flex-wrap gap-4 pt-2">
            <button onclick="addToCart('${item.id}')" class="btn-neon-solid px-8 py-3.5 rounded-xl font-bold text-base flex-1 shadow-[0_0_20px_rgba(0,240,255,0.5)]">
              إضافة إلى السلة 🛒
            </button>
            <a href="/store" class="px-6 py-3.5 rounded-xl bg-navy-800 border border-cyan-500/30 text-gray-300 hover:text-white font-bold text-sm flex items-center gap-2">
              العودة للمتجر ↩
            </a>
          </div>
        </div>
      `;

      document.title = `${item.title} - KHALED ZONE`;
    });
  </script>
</body>
</html>
