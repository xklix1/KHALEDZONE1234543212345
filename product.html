<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل المنتج - KHALED ZONE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#0ea5e9', 600: '#0284c7', 950: '#030712' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <header class="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-xl border-b border-cyan-500/20 shadow-lg shadow-black/50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      
      <div class="flex items-center gap-3">
        <a href="/" class="flex items-center gap-2 group">
          <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 p-0.5 shadow-md shadow-cyan-500/30">
            <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
              <span class="text-2xl">👑</span>
            </div>
          </div>
          <div class="flex flex-col">
            <div class="flex items-center gap-1.5 font-black text-xl tracking-wider">
              <span class="text-white group-hover:text-cyan-400 transition-colors">KHALED</span>
              <span class="text-cyan-400">ZONE</span>
            </div>
            <span class="text-[10px] text-amber-400 font-bold tracking-widest">BLUE ZONE DIGITAL</span>
          </div>
        </a>
      </div>

      <nav class="hidden md:flex items-center gap-2 lg:gap-3 font-bold text-sm">
        <a href="/" class="px-4 py-2.5 text-slate-300 hover:text-cyan-400 hover:bg-slate-900 rounded-xl transition-all">الرئيسية</a>
        <a href="/store" class="px-4 py-2.5 text-slate-300 hover:text-cyan-400 hover:bg-slate-900 rounded-xl transition-all">المتجر</a>
        <a href="/offers" class="px-4 py-2.5 text-slate-300 hover:text-cyan-400 hover:bg-slate-900 rounded-xl transition-all">العروض 🔥</a>
        <a href="/services" class="px-4 py-2.5 text-slate-300 hover:text-cyan-400 hover:bg-slate-900 rounded-xl transition-all">خدمات</a>
        <a href="/about" class="px-4 py-2.5 text-slate-300 hover:text-cyan-400 hover:bg-slate-900 rounded-xl transition-all">من نحن</a>
        <a href="/contact" class="px-4 py-2.5 text-slate-300 hover:text-cyan-400 hover:bg-slate-900 rounded-xl transition-all">تواصل معنا</a>
      </nav>

      <div class="flex items-center gap-3">
        <button onclick="toggleSearchModal()" class="w-10 h-10 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-cyan-400 hover:bg-cyan-500 hover:text-black transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </button>

        <button onclick="toggleCart()" class="relative w-11 h-11 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 p-0.5 shadow-lg shadow-cyan-500/20 hover:scale-105 transition-all">
          <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center text-cyan-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"/></svg>
          </div>
          <span id="cart-badge" class="absolute -top-1.5 -left-1.5 bg-slate-800 text-white font-black text-xs w-6 h-6 rounded-full flex items-center justify-center border-2 border-slate-950">0</span>
        </button>

        <button onclick="document.getElementById('mobile-menu').classList.toggle('hidden')" class="md:hidden w-10 h-10 rounded-xl bg-slate-900 border border-slate-800 text-white flex items-center justify-center">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>

    </div>

    <div id="mobile-menu" class="hidden md:hidden bg-slate-950/95 border-b border-slate-800 px-4 py-4 space-y-2">
      <a href="/" class="block py-2 text-slate-300">الرئيسية</a>
      <a href="/store" class="block py-2 text-slate-300">المتجر</a>
      <a href="/offers" class="block py-2 text-slate-300">العروض</a>
      <a href="/services" class="block py-2 text-slate-300">خدمات</a>
      <a href="/about" class="block py-2 text-slate-300">من نحن</a>
      <a href="/contact" class="block py-2 text-slate-300">تواصل معنا</a>
    </div>
  </header>

  <section class="py-12 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div id="product-detail-view" class="bg-slate-900/60 backdrop-blur-xl rounded-3xl p-8 border border-slate-800 grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
    </div>
  </section>

  <footer class="bg-slate-950 border-t border-slate-800 text-slate-400 py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
      <div class="flex flex-col md:flex-row items-center justify-between gap-6 pb-8 border-b border-slate-800">
        <div class="flex items-center gap-3">
          <span class="text-3xl">👑</span>
          <div>
            <span class="font-black text-2xl text-white">KHALED <span class="text-cyan-400">ZONE</span></span>
            <p class="text-xs text-amber-400">BLUE ZONE DIGITAL MARKETPLACE</p>
          </div>
        </div>
      </div>

      <div class="flex flex-col md:flex-row items-center justify-between gap-4 text-xs text-slate-500">
        <p>© 2026 KHALED ZONE - جميع الحقوق محفوظة. تم التطوير بواسطة <span class="text-cyan-400 font-black tracking-wider">KLIX</span></p>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id') || 'gta5-account';
      const item = (window.products && window.products.find(p => p.id === productId)) || window.products[0];
      
      const detailContainer = document.getElementById('product-detail-view');
      detailContainer.innerHTML = `
        <div class="h-80 sm:h-96 rounded-2xl overflow-hidden border border-slate-800 relative bg-slate-950">
          <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover">
          <span class="absolute top-4 right-4 bg-slate-950/90 border border-cyan-400/50 text-cyan-400 text-xs font-bold px-3 py-1 rounded-lg">${item.badge}</span>
        </div>

        <div class="space-y-6">
          <div>
            <span class="text-xs text-cyan-400 font-bold tracking-wider">${item.category.toUpperCase()}</span>
            <h1 class="text-4xl font-black text-white mt-1">${item.title}</h1>
            <p class="text-sm text-slate-400 mt-1">${item.subTitle}</p>
          </div>

          <div class="flex items-center gap-4">
            <span class="text-3xl font-black text-amber-400">${item.price} جنيه</span>
            ${item.oldPrice ? `<span class="text-lg text-slate-500 line-through">${item.oldPrice} جنيه</span>` : ''}
            <span class="text-xs text-amber-400 bg-slate-950 border border-amber-500/40 px-2.5 py-1 rounded-lg font-bold">${item.rating} تقييم ممتاز</span>
          </div>

          <div class="space-y-3 bg-slate-950 p-5 rounded-2xl border border-slate-800">
            <h4 class="font-bold text-sm text-cyan-400">مميزات الحساب والضمان:</h4>
            <ul class="text-xs text-slate-300 space-y-2">
              ${item.features.map(f => `<li class="flex items-center gap-2"><span class="text-cyan-400 font-bold">✓</span> ${f}</li>`).join('')}
            </ul>
          </div>

          <div class="flex flex-wrap gap-4 pt-2">
            <button onclick="addToCart('${item.id}')" class="px-8 py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold text-base shadow-lg shadow-cyan-500/20 flex-1">
              إضافة إلى السلة 🛒
            </button>
            <a href="/store" class="px-6 py-3.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white font-bold text-sm flex items-center gap-2">
              العودة للمتجر ↩
            </a>
          </div>
        </div>
      `;

      document.title = `${item.title} - KHALED ZONE`;
    });
  </script>
</body>
</html>
